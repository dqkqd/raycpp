name: CI
on:
  push:
  pull_request:
jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-format-21
      - name: Check formatting
        run: clang-format-21 --dry-run -Werror $(git ls-files '*.cpp' '*.hpp')
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-tidy-21
      - name: Generate compile database
        run: |
          cmake -B build
          cp build/compile_commands.json .
      - name: Check
        run: clang-tidy-21 src/*.cpp
