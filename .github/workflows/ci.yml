name: CI
on:
  push:
  pull_request:
jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake catch2
      - name: Configure & build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
      - name: Test
        run: ./build/tests
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: clang-format --dry-run -Werror $(git ls-files '*.cpp' '*.hpp')
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake catch2 clang-tidy
      - name: Generate compile database
        run: |
          cmake -B build
          cp build/compile_commands.json .
      - name: Check
        run: clang-tidy src/*.cpp tests/*.cpp
